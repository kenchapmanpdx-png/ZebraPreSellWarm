<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <!-- Meta Pixel (334231342457223) + GA4 (G-DVEJ68587X) bootstrap. External
         file so the CSP can forbid inline scripts. Disclosed at /privacy.
         Deferred; the vendor libraries load after window load so they do not
         compete with first render (queued events are kept). -->
    <script src="/js/analytics-init.js" defer></script>


    <!--
      Per-page <title>, canonical, description, OG, Twitter tags are
      injected at build time by client/src/prerender.tsx. Do not duplicate
      them here. Universal tags below.
    -->

    <meta name="author" content="ZebraThrive" />
    <meta name="theme-color" content="#0F2A22" />

    <!-- og:image / twitter:image are per-route (ingredient pages get their own
         1200x630 card, everything else the bottle shot); see prerender.tsx. -->
    <meta property="og:site_name" content="ZebraThrive" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/zebra-logo.svg" />

    <!-- Fonts: Montserrat + Playfair Display, self-hosted via @fontsource-variable
         (imported in client/src/main.tsx). No third-party font CSS on the
         critical path. -->

    <!-- Ahrefs Web Analytics -->
    <script src="https://analytics.ahrefs.com/analytics.js" data-key="Dcy0Q6o4Tuy1gsz2xm8hGw" async></script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://www.wellnessforzebras.com/#organization",
      "name": "ZebraThrive",
      "alternateName": "Wellness for Zebras",
      "url": "https://www.wellnessforzebras.com/",
      "logo": {
        "@type": "ImageObject",
        "url": "https://www.wellnessforzebras.com/zebra-logo.svg"
      },
      "description": "US-based supplement brand formulating a 3-component system (AM capsules, PM capsules, Daily Powder) for the EDS, POTS, and MCAS (zebra) community. Mechanism, dose, and primary-literature citations on every ingredient page.",
      "founder": {
        "@type": "Person",
        "name": "Ken Chapman",
        "jobTitle": "Founder, ZebraThrive"
      },
      "knowsAbout": [
        "hypermobile Ehlers-Danlos Syndrome",
        "Postural Orthostatic Tachycardia Syndrome",
        "Mast Cell Activation Syndrome",
        "dietary supplements",
        "extracellular matrix preservation",
        "collagen turnover",
        "histamine degradation",
        "autonomic nervous system support"
      ],
      "areaServed": {
        "@type": "Country",
        "name": "United States"
      },
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "US"
      },
      "contactPoint": [
        {
          "@type": "ContactPoint",
          "email": "ken@wellnessforzebras.com",
          "contactType": "customer service",
          "availableLanguage": ["English"]
        }
      ]}
    </script>
    <!-- No product (DietarySupplement) JSON-LD until launch pricing exists:
         schema.org DietarySupplement is a Product subtype, and Google's Rich
         Results Test flags it "Product snippets: invalid item" without
         offers/review/aggregateRating (verified 2026-11-01, URL mode). -->
    <!-- No-JS fallback: prerendered motion elements start at opacity 0; show them if JS never runs -->
    <noscript><style>[style*="opacity:0"]{opacity:1!important;filter:none!important;transform:none!important}</style></noscript>
  </head>
  <body class="bg-[#FDFBF7] text-[#2c1810] antialiased">
    <!-- Meta Pixel noscript fallback -->
    <noscript><img height="1" width="1" style="display:none" alt=""
      src="https://www.facebook.com/tr?id=334231342457223&ev=PageView&noscript=1" /></noscript>
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:bg-[#0F2A22] focus:text-white focus:px-4 focus:py-2 focus:rounded">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
